# The Hinglish grocery lexicon. Brief section 4.5.
#
# Checked BEFORE any API call. Most of Stage 2 should never touch a model.
#
# ---------------------------------------------------------------------------
# On `category`, and a contradiction inside the brief
# ---------------------------------------------------------------------------
# Section 4.5's example uses `vegetables`, `dairy_eggs` and `staples`. Those are
# from the twelve-domain taxonomy that section 3.8 explicitly retracts:
#
#   "[CORRECTED: I overbuilt this] ... Starting taxonomy, which is only what you
#    actually named: Groceries, Food & Dining, Drinks, Entertainment,
#    Uncategorized. No sub-categories at launch."
#
# 3.8 is dated later and corrects 4.5, so `category` here uses the five real
# slugs. The finer meaning is not lost: it moves to `canonical`, which is where
# it belongs. When there is enough grocery volume to split Groceries into
# Vegetables and Dairy (3.8 says to wait for that), the canonical names are
# already sitting here and Stage 2 re-runs over stored extractions for free.
#
# ---------------------------------------------------------------------------
# On spelling
# ---------------------------------------------------------------------------
# Matching is FUZZY, never exact. Spelling is inconsistent across merchants and
# across orders: bhindi/bhendi, dahi/dhai, paneer/panner, jeera/zeera. Do not
# add every misspelling here; that is what the fuzzy threshold is for. Add a
# `variants` entry only when a spelling is far enough away that fuzzy misses it,
# such as a different word for the same thing.
#
# ---------------------------------------------------------------------------
# How this file grows
# ---------------------------------------------------------------------------
# Not by guessing. Every unmatched token lands in `lexicon_misses`. Once a week,
# read that table, add the real ones here, and re-run Stage 2. The brief's v0.2
# claim that "300 to 400 terms" covers most orders was invented and retracted;
# the real number comes from the miss log after a month of actual receipts.

version: 1

