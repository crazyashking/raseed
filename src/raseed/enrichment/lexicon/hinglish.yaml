  # --- English-primary items -----------------------------------------------
  # Not Hinglish, and here for a measured reason. The first twelve real line
  # items off Blinkit and Zepto were mostly English ("Green Cucumber", "Fresh
  # White Eggs", "English Oven Milk Bread"), and a Hinglish-only lexicon matched
  # 3 of them. The Hinglish entries above now also index their `canonical`
  # spelling, which catches cucumber, carrot, milk and rice. These are the items
  # with no Hindi entry to hang off.
  banana: { canonical: banana, category: groceries, variants: [kela] }
  bread: { canonical: bread, category: groceries, variants: [double roti] }
